<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Super Bibi 2">
    <title>Unity WebGL Player | Super Bibi 2</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button" role="button" tabindex="0" title="Full screen" aria-label="Full screen"></div>
        <div id="unity-build-title">Super Bibi 2</div>
      </div>
    </div>
    <div id="ios-fullscreen-hint" role="dialog" aria-live="polite" aria-label="Full-screen instructions">
      <button id="ios-fullscreen-hint-close" type="button">Close</button>
      <strong>Full screen on iPhone and iPad</strong>
      <span>Tap Safari's Share button, choose Add to Home Screen, then launch Super Bibi 2 from the Home Screen.</span>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var fullscreenHint = document.querySelector("#ios-fullscreen-hint");
      var fullscreenHintClose = document.querySelector("#ios-fullscreen-hint-close");
      var isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isStandalone = window.matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;

      function updateViewportHeight() {
        var height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--app-height", height + "px");
      }

      function enterViewportFullscreen() {
        document.body.classList.add("unity-fullscreen-fallback");
        updateViewportHeight();
        window.scrollTo(0, 0);
        if (isAppleMobile && !isStandalone) {
          fullscreenHint.classList.add("visible");
        }
      }

      function toggleGameFullscreen(unityInstance) {
        if (isAppleMobile && !isStandalone) {
          enterViewportFullscreen();
          return;
        }

        var fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;
        if (fullscreenElement) {
          var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
          if (exitFullscreen) {
            var exitResult = exitFullscreen.call(document);
            if (exitResult && exitResult.catch) {
              exitResult.catch(function(error) {
                console.warn("Could not exit fullscreen.", error);
              });
            }
          }
          return;
        }

        if (document.fullscreenEnabled === true || document.webkitFullscreenEnabled === true) {
          try {
            unityInstance.SetFullscreen(1);
            return;
          } catch (error) {
            console.warn("Native fullscreen failed; using the viewport fallback.", error);
          }
        }

        enterViewportFullscreen();
      }

      updateViewportHeight();
      window.addEventListener("resize", updateViewportHeight);
      window.addEventListener("orientationchange", updateViewportHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportHeight);
      }
      fullscreenHintClose.onclick = function() {
        fullscreenHint.classList.remove("visible");
      };

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "brzapps",
        productName: "Super Bibi 2",
        productVersion: "8.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      canvas.style.background = "url('" + buildUrl + "/WebGL.jpg') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  toggleGameFullscreen(unityInstance);
                };
                fullscreenButton.onkeydown = (event) => {
                  if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleGameFullscreen(unityInstance);
                  }
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
